name: Creator analytics release check

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  creator-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify:creator-analytics

  public-and-creator-regressions:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://fixture:fixture@127.0.0.1:1/fixture
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/tests/verify-public-release.ts
      - run: >-
          bun test
          components/landing/mobile-preview.test.ts
          components/admin/bio-link-tracker.test.tsx
          components/admin/social-accounts-panel.test.tsx
          lib/admin/bio-link-persistence.test.ts
          lib/payments/web-analysis-recovery.test.ts
          lib/creator/creator-catalog.test.ts
          lib/creator/video-captions.test.ts
