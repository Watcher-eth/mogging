name: Creator analytics release check

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  creator-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify:creator-analytics
